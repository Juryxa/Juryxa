<svg width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="reactGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#61DAFB"/>
      <stop offset="100%" stop-color="#2ea6c9"/>
    </linearGradient>
    <linearGradient id="tsGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a9bff"/>
      <stop offset="100%" stop-color="#3178C6"/>
    </linearGradient>
    <linearGradient id="pyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE873"/>
      <stop offset="100%" stop-color="#FFD43B"/>
    </linearGradient>
    <linearGradient id="cppGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f8fd6"/>
      <stop offset="100%" stop-color="#00599C"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="640" height="300" rx="18" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="638" height="298" rx="17" fill="none" stroke="#30363d" stroke-width="1"/>

  <text x="32" y="42" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">
    📊 Language Usage
  </text>
  <text x="32" y="62" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">
    Распределение по языкам и стеку
  </text>

  <!-- Row: React -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <circle cx="38" cy="105" r="5" fill="#61DAFB"/>
    <text x="52" y="110" font-size="14" font-weight="600" fill="#e6edf3">React / JSX</text>
    <text x="592" y="110" font-size="13" font-weight="700" fill="#61DAFB" text-anchor="end">38%</text>
    <rect x="32" y="118" width="560" height="12" rx="6" fill="#21262d"/>
    <rect x="32" y="118" width="212.8" height="12" rx="6" fill="url(#reactGrad)" filter="url(#softShadow)"/>

    <!-- Row: TypeScript -->
    <circle cx="38" cy="152" r="5" fill="#3178C6"/>
    <text x="52" y="157" font-size="14" font-weight="600" fill="#e6edf3">TypeScript</text>
    <text x="592" y="157" font-size="13" font-weight="700" fill="#5a9bff" text-anchor="end">32%</text>
    <rect x="32" y="165" width="560" height="12" rx="6" fill="#21262d"/>
    <rect x="32" y="165" width="179.2" height="12" rx="6" fill="url(#tsGrad)" filter="url(#softShadow)"/>

    <!-- Row: Python -->
    <circle cx="38" cy="199" r="5" fill="#FFD43B"/>
    <text x="52" y="204" font-size="14" font-weight="600" fill="#e6edf3">Python</text>
    <text x="592" y="204" font-size="13" font-weight="700" fill="#FFE873" text-anchor="end">20%</text>
    <rect x="32" y="212" width="560" height="12" rx="6" fill="#21262d"/>
    <rect x="32" y="212" width="112" height="12" rx="6" fill="url(#pyGrad)" filter="url(#softShadow)"/>

    <!-- Row: C++ -->
    <circle cx="38" cy="246" r="5" fill="#00599C"/>
    <text x="52" y="251" font-size="14" font-weight="600" fill="#e6edf3">C++</text>
    <text x="592" y="251" font-size="13" font-weight="700" fill="#2f8fd6" text-anchor="end">10%</text>
    <rect x="32" y="259" width="560" height="12" rx="6" fill="#21262d"/>
    <rect x="32" y="259" width="56" height="12" rx="6" fill="url(#cppGrad)" filter="url(#softShadow)"/>
  </g>

  <text x="32" y="286" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6e7681">
    * приблизительное распределение по личным проектам и опыту
  </text>
</svg>
