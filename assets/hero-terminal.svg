<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1f"/>
      <stop offset="55%" stop-color="#0d1129"/>
      <stop offset="100%" stop-color="#170b2e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d5dfc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="reactBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="tsBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="pyBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="cppBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="panelClip">
      <rect x="2" y="2" width="896" height="296" rx="16"/>
    </clipPath>
    <filter id="glowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="298" rx="17" fill="url(#panelBg)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <g clip-path="url(#panelClip)">
    <circle cx="110" cy="270" r="150" fill="#22d3ee" opacity="0.16" filter="url(#glowBlur)"/>
    <circle cx="800" cy="30" r="140" fill="#a855f7" opacity="0.18" filter="url(#glowBlur)"/>
  </g>

  <!-- title bar -->
  <rect x="1" y="1" width="898" height="42" rx="17" fill="#ffffff" opacity="0.03"/>
  <rect x="1" y="26" width="898" height="17" fill="#ffffff" opacity="0.03"/>
  <line x1="1" y1="43" x2="899" y2="43" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <circle cx="30" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="78" cy="21" r="6" fill="#27c93f"/>

  <text x="450" y="26" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#9aa4b2">~/juryxa — zsh</text>

  <!-- vertical divider -->
  <line x1="578" y1="43" x2="578" y2="284" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- left column -->
  <g font-family="'Fira Code','Courier New',monospace">
    <text x="40" y="92" font-size="16" fill="#e6edf3"><tspan fill="#4ade80">$</tspan> whoami</text>
    <text x="40" y="158" font-size="54" font-weight="700" fill="url(#nameGrad)">Vyacheslav</text>
    <text x="40" y="200" font-size="16" fill="#e6edf3"><tspan fill="#4ade80">$</tspan> cat role.txt</text>
    <text x="40" y="235" font-size="21" font-weight="600" fill="#f0f3f7"><tspan fill="#22d3ee">&gt;</tspan> Full-Stack: React + TypeScript</text>
    <rect x="40" y="245" width="11" height="20" fill="#22d3ee" opacity="0.85"/>
  </g>

  <!-- right column -->
  <g font-family="'Fira Code','Courier New',monospace">
    <text x="610" y="78" font-size="13" fill="#9aa4b2">stack --top</text>

    <text x="610" y="113" font-size="14" fill="#cbd5e1">React</text>
    <rect x="610" y="122" width="230" height="10" rx="5" fill="#1b2333"/>
    <rect x="610" y="122" width="218" height="10" rx="5" fill="url(#reactBar)"/>

    <text x="610" y="155" font-size="14" fill="#cbd5e1">TypeScript</text>
    <rect x="610" y="164" width="230" height="10" rx="5" fill="#1b2333"/>
    <rect x="610" y="164" width="184" height="10" rx="5" fill="url(#tsBar)"/>

    <text x="610" y="197" font-size="14" fill="#cbd5e1">Python</text>
    <rect x="610" y="206" width="230" height="10" rx="5" fill="#1b2333"/>
    <rect x="610" y="206" width="127" height="10" rx="5" fill="url(#pyBar)"/>

    <text x="610" y="239" font-size="14" fill="#cbd5e1">C++</text>
    <rect x="610" y="248" width="230" height="10" rx="5" fill="#1b2333"/>
    <rect x="610" y="248" width="69" height="10" rx="5" fill="url(#cppBar)"/>
  </g>
</svg>
