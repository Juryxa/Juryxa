<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Vyacheslav – Full-Stack developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1f"/>
      <stop offset="1" stop-color="#170b2e"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#7B61FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <clipPath id="win">
      <rect x="1" y="1" width="898" height="298" rx="17"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono',monospace; }
    .dim { fill: #9aa4b2; font-size: 13px; }
    .prompt { fill: #4ade80; }

    .l1 { fill: #e6edf3; font-size: 16px; opacity: 1; animation: l1 12s infinite; }
    .name { font-size: 54px; font-weight: 700; fill: url(#nameGrad); opacity: 1; animation: l2 12s infinite; }
    .l3 { fill: #e6edf3; font-size: 16px; opacity: 1; animation: l3 12s infinite; }
    .l4 { fill: #f0f3f7; font-size: 21px; font-weight: 600; opacity: 1; animation: l4 12s infinite; }
    .cur { fill: #22d3ee; animation: blink 0.8s steps(1) infinite; }

    @keyframes l1 {
      0%     { clip-path: inset(0 100% 0 0); }
      1.67%  { clip-path: inset(0 100% 0 0); animation-timing-function: steps(9, end); }
      5.42%  { clip-path: inset(0 0 0 0); }
      92.92% { clip-path: inset(0 0 0 0); }
      94.58% { clip-path: inset(0 100% 0 0); }
      100%   { clip-path: inset(0 100% 0 0); }
    }
    @keyframes l2 {
      0%     { clip-path: inset(0 100% 0 0); }
      8.33%  { clip-path: inset(0 100% 0 0); animation-timing-function: steps(10, end); }
      15%    { clip-path: inset(0 0 0 0); }
      90.42% { clip-path: inset(0 0 0 0); }
      92.92% { clip-path: inset(0 100% 0 0); }
      100%   { clip-path: inset(0 100% 0 0); }
    }
    @keyframes l3 {
      0%     { clip-path: inset(0 100% 0 0); }
      17.5%  { clip-path: inset(0 100% 0 0); animation-timing-function: steps(12, end); }
      21.25% { clip-path: inset(0 0 0 0); }
      88.75% { clip-path: inset(0 0 0 0); }
      90.42% { clip-path: inset(0 100% 0 0); }
      100%   { clip-path: inset(0 100% 0 0); }
    }
    @keyframes l4 {
      0%     { clip-path: inset(0 100% 0 0); }
      23.75% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(28, end); }
      31.25% { clip-path: inset(0 0 0 0); }
      86.67% { clip-path: inset(0 0 0 0); }
      88.75% { clip-path: inset(0 100% 0 0); }
      100%   { clip-path: inset(0 100% 0 0); }
    }
    @keyframes blink { 50% { opacity: 0; } }

    .stacklbl { fill: #9aa4b2; font-size: 13px; opacity: 1; animation: fadeLbl 12s infinite; }
    @keyframes fadeLbl {
      0%     { opacity: 0; }
      35.83% { opacity: 0; }
      37.5%  { opacity: 1; }
      85.83% { opacity: 1; }
      86.67% { opacity: 0; }
      100%   { opacity: 0; }
    }

    .lbl { fill: #cbd5e1; font-size: 14px; }
    .track { fill: #1b2333; }
    .bar { transform-box: fill-box; transform-origin: left center; }
    .bar-react { animation: growReact 12s infinite; }
    .bar-ts    { animation: growTs 12s infinite; }
    .bar-py    { animation: growPy 12s infinite; }
    .bar-cpp   { animation: growCpp 12s infinite; }
    @keyframes growReact {
      0%     { transform: scaleX(0); }
      37.5%  { transform: scaleX(0); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
      39.58% { transform: scaleX(1); }
      83.33% { transform: scaleX(1); }
      85.83% { transform: scaleX(0); }
      100%   { transform: scaleX(0); }
    }
    @keyframes growTs {
      0%     { transform: scaleX(0); }
      39.58% { transform: scaleX(0); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
      41.67% { transform: scaleX(1); }
      83.33% { transform: scaleX(1); }
      85.83% { transform: scaleX(0); }
      100%   { transform: scaleX(0); }
    }
    @keyframes growPy {
      0%     { transform: scaleX(0); }
      41.67% { transform: scaleX(0); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
      43.75% { transform: scaleX(1); }
      83.33% { transform: scaleX(1); }
      85.83% { transform: scaleX(0); }
      100%   { transform: scaleX(0); }
    }
    @keyframes growCpp {
      0%     { transform: scaleX(0); }
      43.75% { transform: scaleX(0); animation-timing-function: cubic-bezier(.2,.8,.2,1); }
      45.83% { transform: scaleX(1); }
      83.33% { transform: scaleX(1); }
      85.83% { transform: scaleX(0); }
      100%   { transform: scaleX(0); }
    }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="898" height="298" rx="17" fill="url(#bg)"/>
  <g clip-path="url(#win)" opacity="0.55">
    <circle cx="120" cy="270" r="140" fill="#22d3ee" filter="url(#blur)">
      <animate attributeName="cx" values="120;320;120" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="25" r="130" fill="#a855f7" filter="url(#blur)">
      <animate attributeName="cx" values="780;580;780" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="1.5" y="1.5" width="897" height="297" rx="17" fill="none" stroke="url(#border)" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="30" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="54" cy="21" r="6" fill="#febc2e"/>
  <circle cx="78" cy="21" r="6" fill="#28c840"/>
  <text x="450" y="26" text-anchor="middle" class="mono dim">~/juryxa — zsh</text>
  <line x1="1" y1="43" x2="899" y2="43" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- left: terminal -->
  <text x="40" y="92" class="mono dim l1"><tspan class="prompt">$</tspan> whoami</text>
  <text x="40" y="158" class="mono name">Vyacheslav</text>
  <text x="40" y="200" class="mono dim l3"><tspan class="prompt">$</tspan> cat role.txt</text>
  <text x="40" y="235" class="mono l4"><tspan fill="#22d3ee">&gt;</tspan> Full-Stack: React + TypeScript<tspan class="cur">▍</tspan></text>

  <!-- right: stack bars -->
  <line x1="578" y1="43" x2="578" y2="284" stroke="#ffffff" stroke-opacity="0.08"/>
  <g class="mono">
    <text x="610" y="78" class="stacklbl">stack --top</text>

    <text x="610" y="113" class="lbl">React</text>
    <rect x="610" y="122" width="230" height="10" rx="5" class="track"/>
    <rect x="610" y="122" width="230" height="10" rx="5" fill="#22d3ee" class="bar bar-react"/>

    <text x="610" y="155" class="lbl">TypeScript</text>
    <rect x="610" y="164" width="230" height="10" rx="5" class="track"/>
    <rect x="610" y="164" width="184" height="10" rx="5" fill="#3178C6" class="bar bar-ts"/>

    <text x="610" y="197" class="lbl">Python</text>
    <rect x="610" y="206" width="230" height="10" rx="5" class="track"/>
    <rect x="610" y="206" width="127" height="10" rx="5" fill="#FFD43B" class="bar bar-py"/>

    <text x="610" y="239" class="lbl">C++</text>
    <rect x="610" y="248" width="230" height="10" rx="5" class="track"/>
    <rect x="610" y="248" width="69" height="10" rx="5" fill="#7B61FF" class="bar bar-cpp"/>
  </g>
</svg>
